[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
authors = ["David Duran <dadch1404@gmail.com>"]
license = "MIT"
license-file = "LICENSE"
repository = "https://github.com/totallynotdavid/music-stats"
homepage = "https://github.com/totallynotdavid/music-stats"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
